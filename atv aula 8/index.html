<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Formulário de Cadastro</h1>
    <p class="subtitulo">Preencha todos os campos obrigatórios.</p>

    <form id="formCadastro" novalidate>
      <div class="grid">
        <div class="campo">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" placeholder="Seu nome completo">
          <span class="erro" id="erro-nome"></span>
        </div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="voce@exemplo.com">
          <span class="erro" id="erro-email"></span>
        </div>

        <div class="campo">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric">
          <span class="erro" id="erro-cpf"></span>
        </div>

        <div class="campo">
          <label for="telefone">Telefone</label>
          <input type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000" maxlength="15" inputmode="numeric">
          <span class="erro" id="erro-telefone"></span>
        </div>

        <div class="campo">
          <label for="nascimento">Data de nascimento</label>
          <input type="date" id="nascimento" name="nascimento">
          <span class="erro" id="erro-nascimento"></span>
        </div>

        <div class="campo">
          <label for="genero">Gênero</label>
          <select id="genero" name="genero">
            <option value="">Selecione</option>
            <option value="feminino">Feminino</option>
            <option value="masculino">Masculino</option>
            <option value="outro">Outro</option>
            <option value="nao-informar">Prefiro não informar</option>
          </select>
          <span class="erro" id="erro-genero"></span>
        </div>

        <div class="campo">
          <label for="cep">CEP</label>
          <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" inputmode="numeric">
          <span class="erro" id="erro-cep"></span>
        </div>

        <div class="campo">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" name="cidade" placeholder="Sua cidade">
          <span class="erro" id="erro-cidade"></span>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Mín. 8 caracteres, letras e números">
          <span class="erro" id="erro-senha"></span>
        </div>

        <div class="campo">
          <label for="confirmaSenha">Confirmar senha</label>
          <input type="password" id="confirmaSenha" name="confirmaSenha" placeholder="Repita a senha">
          <span class="erro" id="erro-confirmaSenha"></span>
        </div>
      </div>

      <div class="campo termos">
        <label class="checkbox">
          <input type="checkbox" id="termos" name="termos">
          <span>Li e aceito os termos de uso</span>
        </label>
        <span class="erro" id="erro-termos"></span>
      </div>

      <button type="submit" id="btnEnviar">Cadastrar</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
